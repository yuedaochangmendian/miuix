# A fork-only workflow.
#
# The upstream workflows only run for pushes and pull requests that target `main`, so a feature
# branch in a fork gets no build at all. This one builds the branch the PiliNara theme lives on,
# running the same ubuntu targets as the upstream `Build All Tests` workflow.
name: PiliNara Theme Build

on:
  push:
    branches:
      - "feat/pilinara-theme"
      - "ci/pilinara-build"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilinara-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "spotlessCheck"
          - target: ":miuix-ui:desktopTest"
          - target: "assembleAndroidTest"
          - target: "wasmJsBrowserTest"
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run build
        run: ./gradlew ${{ matrix.target }} --console=plain
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ strategy.job-index }}
          path: |
            **/build/reports/**
